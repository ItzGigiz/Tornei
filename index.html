<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigi's Games</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #bb86fc;
            --secondary-color: #03dac6;
            --warning-color: #ffb74d;
            --danger-color: #cf6679;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3 { color: var(--accent-color); text-align: center; margin-top: 5px;}

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .hidden { display: none !important; }

        /* Dashboard & Lists */
        .tournament-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .tournament-card {
            background: #2a2a2a; padding: 15px; border-radius: 8px; display: flex;
            gap: 15px; align-items: center; border-left: 4px solid var(--accent-color);
        }
        .tournament-card.quiz-type { border-left-color: var(--secondary-color); }
        .tournament-card.archived-card { border-left-color: var(--warning-color); opacity: 0.8; }
        .tournament-cover-thumb {
            width: 70px; height: 70px; object-fit: cover; border-radius: 6px; background: #333;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            flex-shrink: 0; border: 1px solid #444; text-align: center; word-break: break-word; overflow: hidden; padding: 4px; box-sizing: border-box; font-weight: bold;
        }
        .tournament-info { flex-grow: 1; }
        .tournament-info h3 { text-align: left; margin: 0 0 5px 0; color: #fff; }
        .tournament-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }
        .tournament-actions { display: flex; flex-direction: column; gap: 5px; }
        @media (min-width: 650px) { .tournament-actions { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; } }

        /* Inputs & Builders */
        .input-text { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        .input-text:focus { outline: none; border-color: var(--accent-color); }
        .input-group { margin-bottom: 20px; padding: 15px; border: 2px dashed #333; border-radius: 8px; }
        .unified-adder-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .unified-adder-row .input-text { margin-bottom: 0; flex-grow: 1; }
        input[type="file"] { display: none; }
        
        /* Buttons */
        .btn { padding: 10px 14px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; font-size: 13px; transition: opacity 0.2s; text-align: center; }
        .btn-primary { background: var(--accent-color); color: #000; }
        .btn-secondary { background: var(--secondary-color); color: #000; }
        .btn-warning { background: var(--warning-color); color: #000; }
        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-block { display: block; width: 100%; padding: 12px; font-size: 16px; margin-top: 10px;}
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Item Grid Previews */
        .item-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 15px; max-height: 280px; overflow-y: auto; }
        .item-preview { background: #252525; padding: 5px; border-radius: 5px; text-align: center; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #333; }
        .item-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
        .preview-text-placeholder { width: 100%; height: 80px; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: bold; color: var(--accent-color); padding: 5px; box-sizing: border-box; font-size: 11px; word-break: break-word; overflow: hidden; }
        .item-preview input { width: 90%; background: #333; border: none; color: #fff; padding: 4px; margin-top: 5px; text-align: center; border-radius: 3px; font-size: 11px; }
        .btn-remove-item { background: rgba(207, 102, 121, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color); border-radius: 3px; cursor: pointer; padding: 2px; font-size: 10px; margin-top: 5px; width: 100%; font-weight: bold; }

        /* Quiz Builder */
        .question-builder-box { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; }
        .answers-builder-container { margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--secondary-color); }
        .answer-builder-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }

        /* Matchup Arena (Torneo) */
        .round-title { text-align: center; font-size: 24px; margin-bottom: 20px; color: var(--text-secondary); }
        .matchup-container { display: flex; justify-content: space-around; gap: 20px; margin-top: 20px; }
        @media (max-width: 600px) { .matchup-container { flex-direction: column; } }
        .card { flex: 1; background: #252525; border: 3px solid transparent; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; text-align: center; display: flex; flex-direction: column; }
        .card:hover { transform: scale(1.02); border-color: var(--accent-color); }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .card-placeholder { width: 100%; height: 350px; background: #2e2e2e; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: var(--accent-color); padding: 25px; box-sizing: border-box; text-align: center; word-break: break-word; border-bottom: 1px solid #333; }
        @media (max-width: 600px) { .card img, .card-placeholder { height: 230px; } .card-placeholder { font-size: 20px; } }
        .card-name { padding: 15px; font-size: 20px; font-weight: bold; margin-top: auto; }
        .vs { display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: var(--accent-color); }

        /* Quiz Game Arena & Timer */
        .quiz-answers-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        @media (min-width: 600px) { .quiz-answers-grid { grid-template-columns: 1fr 1fr; } }
